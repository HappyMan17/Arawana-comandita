services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  back:
    build: ./arawana-comandita-back
    restart: unless-stopped
    env_file: ./arawana-comandita-back/.env   # SECRET_JWT_SEED etc.
    environment:
      PORT: 4000
      DB_CN: mongodb://mongo:27017/arawana    # overrides the Atlas URL; remove to keep using Atlas
    volumes:
      - back_files:/app/public/files          # keeps the generated .xlsx files across restarts
    depends_on:
      - mongo

  front:
    build:
      context: ./arawana-comandita-front
      args:
        VITE_API_URL: /api                    # Vite bakes this in at build time
    restart: unless-stopped
    ports:
      - "8080:80"                             # 8080 is already in ACCEPTED_ORIGINS
    depends_on:
      - back

volumes:
  mongo_data:
  back_files:
